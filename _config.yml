# ---- EDIT THESE ----------------------------------------------------------
title: "Your Blog Title"
name: "Your Name"
description: "Notes on world models, planning and experiments."
url: "https://boriskrulj.github.io"               # no trailing slash
baseurl: "/repo_git"                              # the repository name; use "" if you later move this to a repository named boriskrulj.github.io
repository: "boriskrulj/repo_git"
author:
  name: "Boris Kruljevic"
  avatar: ""                                    # e.g. "/assets/images/me.jpg" (put the file in assets/images)
  bio: "One or two lines about you."
  location: ""
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/boriskrulj"
# ---------------------------------------------------------------------------

# Theme: Minimal Mistakes as a remote theme, which GitHub Pages can build without any gem install.
remote_theme: "mmistakes/minimal-mistakes@4.26.1"
minimal_mistakes_skin: "default"                # also: air, aqua, contrast, dark, dirt, neon, mint, plum, sunrise
locale: "en-US"
search: true

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate

markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:title/
paginate: 8
paginate_path: /page:num/
timezone: Europe/Brussels

include:
  - _pages

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      toc: true
      toc_sticky: true
      share: false
      comments: false
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
